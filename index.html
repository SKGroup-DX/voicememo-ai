  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;-webkit-user-select:none;user-select:none}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#1C1C1E}
    button{-webkit-appearance:none;appearance:none;border:none;background:none;cursor:pointer;color:inherit}
    input,select,textarea{-webkit-appearance:none;appearance:none;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(60,60,67,.2);border-radius:4px}
    input[type=range]{-webkit-appearance:none;appearance:none;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 3px rgba(0,0,0,.25)}
    html,body{height:100%;background:#F2F2F7;overflow:hidden}
    #root{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#F2F2F7}
    @media(min-width:768px){#root>div{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.12);height:100%}}
    @keyframes pulse-ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
    .spin{animation:spin .9s linear infinite}
    .shake{animation:shake .5s ease both}
  </style>
</head>
